# RD-B6 (2026-07-25) — alert-handler rate-limit widening. 600s -> 3600s.
#
# watcher_alert.py rate-limits to at most one post per unit per WATCHER_ALERT_INTERVAL_SEC
# (marker file per unit; a suppressed alert is LOGGED to the handler's journal, never
# silently dropped). The stock default is 600s (10 min).
#
# 🚨 WHY 600s WAS TOO SHORT: it is shorter than the cadence of the two frequent timer-
#    backed units RD-B6 just wired, so it suppressed NOTHING for exactly the units that
#    could flood. Measured cadences: trevor-funnel-watch every 15min (~96 runs/day) and
#    trevor-tailsync every ~21.5min (~67 runs/day). A persistently failing probe would
#    therefore have posted ~96 alerts/day. A channel that gets 96 alerts a day is muted
#    within a day, and a muted spine is not a spine -- it is the same silent-lifecycle
#    failure with extra steps.
#
#    At 3600s the worst case per unit is <=24 alerts/day.
#
# 🚨 TRADE-OFF, stated plainly: A GENUINE BURST IS NOW UNDER-REPORTED. If a unit fails
#    six times in an hour, you will see one alert, not six. The information lost is the
#    COUNT, not the FACT -- for a DEATH alert the fact is what matters ("this unit is
#    down"), and the retry count is recoverable from `systemctl show -p NRestarts` and
#    the journal, both of which the alert body already carries. Accepted deliberately.
#    A rate-limited skip still prints to the handler's own journal, so the suppressed
#    occurrences remain auditable on the box.
#
# Applies to EVERY trevor-alert@ instance (template-level drop-in). Per-instance tuning,
# if ever needed, goes in /etc/systemd/system/trevor-alert@<instance>.service.d/.
#
# 🚨 Deliberately adds NO OnFailure= to the handler. The handler must never be able to
#    trigger itself -- that is the recursion guard the parent unit documents. A handler
#    failure stays loud in its own journal (watcher_alert.py prints to stderr and exits
#    non-zero) and stops there.
#
# Rollback: rm this file from /etc/systemd/system/trevor-alert@.service.d/ and
# `systemctl daemon-reload`. Reverts to the 600s in-script default.
[Service]
Environment=WATCHER_ALERT_INTERVAL_SEC=3600
