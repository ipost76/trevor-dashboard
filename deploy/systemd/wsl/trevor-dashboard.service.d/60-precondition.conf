# B4-HUB-RESILIENCE (2026-08-02) — .next manifest preconditions.
#
# On 2026-08-02 the Hub died 5× in 10s with an opaque 12-line Node stack trace ending
# ENOENT on .next/prerender-manifest.json, thrown from setupFsCheck() inside Next's
# initialize(). systemd hit StartLimitBurst and gave up at 00:12:23; the Hub stayed
# down 21m53s. Nothing in the journal said "the build is incomplete" — you had to read
# a stack trace to find out.
#
# 🚨 SCOPE, STATED HONESTLY — THIS DOES NOT PREVENT THE OUTAGE.
#    A broken build is still broken and the unit still fails. Restart=on-failure still
#    retries, so the start-limit budget is still consumed. What changes is LEGIBILITY:
#    the journal now names the missing precondition instead of printing a Node stack,
#    and `systemctl status` points at the exact failing test. The change that actually
#    removes this failure class is scripts/build_atomic.sh, not this file.
#
# Absolute paths: ExecStartPre= does not go through a shell, so WorkingDirectory= is
# not applied to a bare relative argument in the way a reader might expect.
[Service]
ExecStartPre=/usr/bin/test -s /home/ghost/projects/trevor-dashboard/.next/prerender-manifest.json
ExecStartPre=/usr/bin/test -s /home/ghost/projects/trevor-dashboard/.next/routes-manifest.json
ExecStartPre=/usr/bin/test -s /home/ghost/projects/trevor-dashboard/.next/build-manifest.json
