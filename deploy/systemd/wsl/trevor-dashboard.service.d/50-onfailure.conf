# RD-B6 (2026-07-25) — WSL death-alert spine. LONG-RUNNING DAEMON variant.
#
# OnFailure= wires this unit's `failed` state to the RF2-C1 WSL-local alert handler
# (trevor-alert@.service), templated on %n = this unit's full name. The handler posts
# to Discord from WSL directly — there is no VM->WSL authenticated path, which is why
# the VM-side handler cannot see these units and this one can.
#
# 🚨 StartLimitIntervalSec=60s — WHAT IT DOES AND DOES NOT BUY. Read this before
#    assuming it is what makes the alert work. IT IS NOT.
#
#    MEASURED (RD-B6, two scratch units, both with the OnFailure= above):
#      CONTROL, stock Burst=5/Interval=10s + RestartSec=3s -> the unit NEVER reaches
#        `failed` (9 restarts in 30s, ActiveState stayed `activating`/auto-restart,
#        exactly as predicted: 5 starts cannot fit a 10s window at 3s spacing).
#        THE ALERT STILL FIRED AND WAS DELIVERED (HTTP 204).
#      TEST, Burst=5/Interval=60s + RestartSec=3s -> `failed` at t=15s, alert delivered.
#
#    So OnFailure= triggers on EVERY FAILED START, not only on the terminal `failed`
#    state. Alerting does NOT depend on this line. An earlier RD-B6 gate claim that
#    these daemons "cannot alert" without it was WRONG and is corrected here.
#
#    What 60s actually buys: a sustained crash-loop now TERMINATES in `failed` instead
#    of restarting forever. That matters because a forever-flapping unit posts its one
#    rate-limited alert and then churns invisibly -- it never appears in
#    `systemctl --failed`, so every surface keyed on failed state stays green while the
#    service is dead. This turns an endless silent loop into a terminal, visible state.
#
# 🚨 RESTART SEMANTICS CHANGE — deliberate, accepted, on the record:
#    A SUSTAINED crash-loop now STOPS being restarted and STAYS DOWN in `failed`.
#    A TRANSIENT crash is UNAFFECTED -- it still restarts exactly as before; only the
#    5th failed start within 60s terminates the unit.
#    COST, stated honestly: a flap that would previously have self-healed after many
#    minutes of retrying (e.g. waiting out a slow dependency) now stays down until a
#    human runs `sudo systemctl reset-failed <unit> && sudo systemctl start <unit>`.
#    Assessed low on this box -- these daemons bind 127.0.0.1 and need no network to
#    start, and the journal shows ZERO failures for all six units since 2026-07-14 --
#    but it is a real trade, not a free one. If a boot-race flap ever bites, the
#    tolerant tuning is Burst=10/Interval=120s rather than reverting this file.
#
# Does NOT cover: a never-started unit (F2), a wedged-but-not-failed loop (F1), or a
# total WSL network outage (F4). Do NOT "fix" F1 with a bare WatchdogSec here -- it
# would SIGABRT a healthy long-running loop every cycle.
#
# Rollback: rm this file (+ its siblings) from /etc/systemd/system/<unit>.service.d/
# and `systemctl daemon-reload`. Restores stock behaviour exactly.
[Unit]
OnFailure=trevor-alert@%n.service
StartLimitIntervalSec=60s
