# RD-B6 (2026-07-25) — WSL death-alert spine. TIMER-BACKED ONESHOT variant.
#
# OnFailure= wires this unit's `failed` state to the RF2-C1 WSL-local alert handler
# (trevor-alert@.service), templated on %n = this unit's full name.
#
# NO StartLimit tuning here, and none is wanted: this is a Restart=no oneshot, so ANY
# non-zero exit reaches `failed` immediately on the first try. Unlike the long-running
# daemons (see their 50-onfailure.conf), the failed state is trivially reachable.
#
# 🚨 The drop-in belongs on the .SERVICE, never the .TIMER. A systemd timer does NOT
#    enter `failed` when the service it triggers fails -- failure does not propagate
#    upward -- so a service-only drop-in catches every real failure, and putting one
#    on both units would double-alert a single incident for no gain.
#
# ALERT VOLUME: THE WORST CASE ON THIS BOX. Driven by trevor-funnel-watch.timer at
# OnUnitActiveSec=15min => ~96 runs/day. The handler's stock 600s (10min) limiter is
# SHORTER than the 15min cadence, so it would have suppressed NOTHING: a persistently
# failing probe meant ~96 alerts/day, and a spine that posts 96 times a day gets muted
# within a day -- which is the same as not having one. RD-B6 raised the limiter to
# 3600s (see trevor-alert@.service.d/50-rate-limit.conf), capping this unit at <=24/day.
#
# 🚨 F4 INTERACTS WITH THIS UNIT SPECIFICALLY. This probe's whole job is to detect a
#    dead public Funnel edge, and its alert leaves over the same internet the probe
#    just found broken. A total WSL network outage defeats both. Accepted, not hidden.
#
# Does NOT cover: a never-started unit (F2) -- notably, if the TIMER itself is stopped
# or disabled this service simply never runs and nothing alerts -- a wedged-but-not-
# failed run (F1; a hung probe is bounded instead by TimeoutStartSec=2min, which DOES
# end in `failed` and so DOES alert), or a total WSL network outage (F4).
#
# Rollback: rm this file (+ its siblings) from /etc/systemd/system/<unit>.service.d/
# and `systemctl daemon-reload`.
[Unit]
OnFailure=trevor-alert@%n.service
