# TREVOR Hub — staged systemd drop-in (REL-13, 2026-06-02)
#
# Reduces TimeoutStopSec from 90s (systemd default — no explicit line in the
# unit) to 15s, so a stop/restart escalates SIGTERM -> SIGKILL faster, speeding
# watchdog recovery (aligns with the health watchdog's 15s --max-time poll).
# Mirrors REL-01's .service.d drop-in approach (no unit file lives in the Hub
# repo). Coexists with the existing cpuweight.conf drop-in.
#
# Apply on main (see the wave's Merge Step):
#   sudo cp deploy/systemd/trevor-dashboard.service.d/timeout.conf \
#       /etc/systemd/system/trevor-dashboard.service.d/timeout.conf
#   sudo systemctl daemon-reload
#   (then the coordinated Hub restart)
[Service]
TimeoutStopSec=15
