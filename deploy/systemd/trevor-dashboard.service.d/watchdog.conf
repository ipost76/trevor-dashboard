# TREVOR Hub — staged systemd drop-in (INFRA-02, RM-HUB Wave 4, 2026-06-02)
#
# Adds a systemd liveness watchdog as a SUBORDINATE backstop beneath the
# /api/health watchdog (which stays the single primary restart authority per
# REL-06/08). If the Hub's Node process stops sending sd_notify(WATCHDOG=1)
# within WatchdogSec, systemd SIGABRTs + restarts it (Restart=always) — catching
# a HUNG-BUT-ALIVE event loop that Restart=always alone never sees.
#
# WatchdogSec=60s is deliberately ABOVE the health watchdog's ~60-75s reaction
# (30s poll × 2 consecutive fails + 15s --max-time) AND far above the ~1.3s
# cold-start manifest block + the few-second Next app.prepare() boot, so:
#   - no false-kill on boot (first ping lands ~20s after listening << 60s), and
#   - systemd only fires as a LAST resort, after the primary watchdog has had
#     its chance + its loud #qa-agent give-up page — it can't restart-loop ahead
#     of that page.
#
# NotifyAccess=all (not main): Node core dgram can't open an AF_UNIX SOCK_DGRAM,
# so the WATCHDOG=1 ping is sent via the /usr/bin/systemd-notify CHILD process
# (see sd-watchdog.js). A child pid is rejected under NotifyAccess=main; `all`
# accepts senders from this service's OWN cgroup only (negligible spoof surface
# for a single-process unit) — the accepted tradeoff vs adding a native addon.
# The ping is responsiveness-gated in sd-watchdog.js (main-loop timer + fresh
# heartbeat + server.listening), so a wedged loop stops pinging -> systemd fires.
#
# Type stays simple (from the main unit) — we feed the watchdog, we do NOT gate
# startup readiness on READY=1 (that would need Type=notify).
#
# Apply on main (coordinated restart step):
#   sudo cp deploy/systemd/trevor-dashboard.service.d/watchdog.conf \
#       /etc/systemd/system/trevor-dashboard.service.d/watchdog.conf
#   sudo systemctl daemon-reload
#   (then the coordinated Hub restart — server.js must restart to load sd-watchdog.js)
# Revert: delete the drop-in + daemon-reload (WatchdogSec unset -> watchdog off).
[Service]
NotifyAccess=all
WatchdogSec=60s
