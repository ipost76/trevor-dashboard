# TREVOR Hub — staged systemd drop-in (REL-03, RM-HUB Wave 4, 2026-06-02)
#
# Raises the V8 old-space heap ceiling 512MB -> 640MB. Sized against the
# POST-Wave-1 steady-state RSS (~89MB, 10h+ uptime under the REL-01 CPUWeight
# fix), NOT the 134MB overloaded pre-fix figure. 640MB gives ~7x current-RSS
# GC headroom while keeping the theoretical peak process RSS (~640 old-space +
# ~150MB native/code/young-gen overhead = ~790MB) UNDER the existing
# MemoryHigh=800M throttle band, and far under MemoryMax=1500M. The box is ~8GB
# (free shows ~7.9GB total), so 768MB was rejected — its theoretical peak
# (~900MB) would brush MemoryHigh and waste RAM on the shared VM.
#
# Mechanism: a drop-in Environment= assignment to NODE_OPTIONS overrides the
# main unit file's `Environment=NODE_OPTIONS=--max-old-space-size=512` (drop-ins
# are parsed after the main unit; last assignment to the same var wins).
# Mirrors REL-01 (cpuweight.conf) / REL-13 (timeout.conf) drop-in precedent.
# Coexists with those drop-ins.
#
# Apply on main (coordinated restart step):
#   sudo cp deploy/systemd/trevor-dashboard.service.d/heap.conf \
#       /etc/systemd/system/trevor-dashboard.service.d/heap.conf
#   sudo systemctl daemon-reload
#   (then the coordinated Hub restart)
# Revert: delete the drop-in + daemon-reload (falls back to 512).
[Service]
Environment=NODE_OPTIONS=--max-old-space-size=640
