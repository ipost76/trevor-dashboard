# TREVOR Hub nginx site config — staged copy for /etc/nginx/sites-available/trevor-hub
#
# PERF-01 (2026-06-02): /_next/static/ is now served DIRECTLY FROM DISK via
# `alias` with immutable 1yr caching, instead of being proxied through Node with
# a `no-cache` override. Content-hashed build chunks (.next/static/) are safe to
# cache forever; this removes a large chunk of needless Node request handling.
#
# PERF-05 (2026-06-02): HTTP/2 enabled on the 443 listener (`listen 443 ssl
# http2`) — multiplexes Hub asset/API requests over one TLS connection. nginx
# 1.18.0 uses the `listen … http2` flag (the `http2 on;` directive is 1.25.1+).
#
# Apply on main: copy this file to /etc/nginx/sites-available/trevor-hub,
# `sudo nginx -t`, then `sudo systemctl reload nginx`. See the wave's Merge Step.

# Upgrade map for WebSocket support
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    server_name trevor-prime.com;

    # ── IP allowlist (2026-04-24 security lockdown) — Ghost only ──
    allow 140.248.44.199;
    allow 72.186.5.231/32;                  # Ghost residential IPv4 (added 2026-05-01 I1)
    allow 2a04:4e41:3a03:bf15::9e70:2f15;
    allow 2a04:4e41:3a03:bf15::/64;
    allow 172.32.0.0/11;                    # Ghost T-Mobile CGNAT (mobile)
    allow 47.205.254.93;                  # Trevor (added 2026-05-25)
    deny all;

    # Hub — proxy to Next.js on port 3333
    location / {
        proxy_pass http://127.0.0.1:3333;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # SSE — Trevor chat stream (REL-07, 2026-06-02). Disable proxy buffering so
    # tokens flush to the client immediately instead of being held in nginx's
    # buffer. Longest-prefix match wins over `location /` regardless of order.
    location /api/chat/stream {
        proxy_pass http://127.0.0.1:3333;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # WebSocket for terminal
    location /ws/terminal {
        proxy_pass http://127.0.0.1:3333/ws/terminal;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 14400s;
        proxy_send_timeout 14400s;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 10M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 1000;


    # Next.js static assets — served directly from disk with immutable long cache.
    # PERF-01 (2026-06-02): was proxied through Node on 3333 with a no-cache
    # override; now `alias`-served from .next/static/ on disk. Filenames are
    # content-hashed, so a 1-year immutable cache is safe — a new build emits new
    # hashes. The alias points at the exact directory the running `node server.js`
    # builds into, so disk and the HTML's referenced hashes are always in sync.
    location /_next/static/ {
        alias /home/trevor/trevor-dashboard/.next/static/;
        access_log off;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    # SCOUT API — proxy to FastAPI on 127.0.0.1:3334 (D1, 2026-05-10)
    location /api/scout/ {
        proxy_pass http://127.0.0.1:3334/api/scout/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl http2; # managed by Certbot — http2 added PERF-05 2026-06-02
    ssl_certificate /etc/letsencrypt/live/trevor-prime.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/trevor-prime.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

# n8n default_server — n8n on :5678 is DOWN (no service). INFRA-03 (RM-HUB
# Wave 4, 2026-06-02): proxying every port-80 raw-IP hit to the dead :5678
# upstream spammed error.log with hundreds of `connect() failed (111)` lines
# (internet IP-scanners probing /.env.swp, /.env.local.swp, etc. on the raw IP).
# This block keeps its `default_server` role so it still absorbs that IP-scan
# junk (never falling through to the real trevor-prime.com server block) — but
# `return 444` drops the connection with no upstream connect and `access_log
# off` silences the access noise. Net: the n8n connect-refused spam stops.
# Restore the proxy_pass block (commented below) when n8n returns on :5678.
server {
    listen 80 default_server;
    server_name _;

    location / {
        return 444;
        access_log off;

        # --- Restore when n8n is back up on :5678 ---
        # proxy_pass http://127.0.0.1:5678;
        # proxy_http_version 1.1;
        # proxy_set_header Host $host;
        # proxy_set_header X-Real-IP $remote_addr;
        # proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # proxy_set_header X-Forwarded-Proto $scheme;
        # proxy_set_header Upgrade $http_upgrade;
        # proxy_set_header Connection $connection_upgrade;
        # proxy_read_timeout 300s;
        # proxy_send_timeout 300s;
        # proxy_buffering off;
        # proxy_cache off;
    }
}


server {
    if ($host = trevor-prime.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name trevor-prime.com;

    # ── IP allowlist (2026-04-24 security lockdown) — Ghost only ──
    allow 140.248.44.199;
    allow 72.186.5.231/32;                  # Ghost residential IPv4 (added 2026-05-01 I1)
    allow 2a04:4e41:3a03:bf15::9e70:2f15;
    allow 2a04:4e41:3a03:bf15::/64;
    allow 172.32.0.0/11;                    # Ghost T-Mobile CGNAT (mobile)
    allow 47.205.254.93;                  # Trevor (added 2026-05-25)
    deny all;
    return 404; # managed by Certbot


}
