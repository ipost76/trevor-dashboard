# ─────────────────────────────────────────────────────────────────────────────
# G-5 replica publish gate — declared constants.  RM-REPAIR [B2], 2026-08-11.
#
# Read by tailsync_gate.py, which is called by trevor-tailsync.sh and
# trevor-restore.sh. 🚨 NOTHING HERE HAS A DEFAULT IN THE CODE. Every value is a
# MEASURED quantity with its provenance recorded beside it; if one is absent the
# gate degrades (ABORT for t0, UNCOMPARABLE for the window) rather than guessing.
# A gate that invents its own boundary is asserting on a number nobody derived.
# ─────────────────────────────────────────────────────────────────────────────

# t0 — the shadow instance's start instant. Trades opened at or before it are
# INHERITED (identical on every box, because they came from the same copied
# bytes); trades after it are each instance's own book.
#
# 🚨 DECLARED AS A NAIVE EASTERN WALL-CLOCK STRING, NOT AN EPOCH, ON PURPOSE.
# `opened_at` is naive Eastern (while `created_at` is real UTC — a 4-hour offset,
# 28 tables carry both). t0 is parsed with the SAME tradekey.ts_epoch as the rows
# it is compared against, so the partition boundary stays correct even on a box
# whose clock is not ET. A hardcoded epoch would be silently 4 hours out there,
# and 4 hours of misclassified trades reads exactly like drift.
#
# Provenance: harness/var/state/shadow_t0.json, written by RM-CUTOVER C5 Phase 1
# at the shadow start after Ghost's DECISION 1 re-copy. Cross-checked live
# 2026-08-11: "t0_iso": "2026-08-10T22:48:51-04:00".
t0_naive_et = 2026-08-10 22:48:51
t0_iso      = 2026-08-10T22:48:51-04:00

# The post-cutover match window. Used ONLY to report how much two DIFFERENT
# ledgers share; it never gates a publish.
#
# 🚨 DERIVED, NOT GUESSED — and deliberately the SAME number the harness uses
# (harness/etc/harness.conf [shadow_state]). Measured on production 2026-08-10
# from 29 consecutive [SCAN-SUMMARY] intervals in trevor.log:
#     min 172s · median 180s · mean 180.1s · max 190s
# Two instances scanning on a ~180s period may sit up to one full period out of
# phase, so the window is one period widened to the measured maximum.
open_match_window_seconds = 190
scan_period_provenance    = 29 samples, production trevor.log [SCAN-SUMMARY], 2026-08-10, median 180s max 190s

# 🚨 THE PIN ON THE SHARED TRADE KEY.
# tradekey.py is the harness's own module, deployed here byte-identically
# because the gate and the harness run on different machines and cannot share a
# process. Two physical copies of a value with nothing enforcing agreement is
# the U-15 shape, so agreement is enforced: this sha256 is asserted at load and a
# drifted copy makes the gate FAIL CLOSED (refuse to publish), never proceed on
# an unverified key. An ABSENT pin is rejected too — it is not a pass.
#
# The other side of the pin: harness/etc/harness.conf [shadow_state]
# tradekey_sha256, on ghostbox. Changing tradekey.py means updating BOTH.
tradekey_sha256 = 87b08dcce2aec190071a566e0844784e0120c1169009203a0a9afa885378a3cf
